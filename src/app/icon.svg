  <rect x="13.1" y="5.8" width="5.8" height="5.8" rx="1.7" fill="#FFFFFF" fill-opacity="0.90"/>
  <rect x="20.4" y="5.8" width="5.8" height="5.8" rx="1.7" fill="#9BE9A8"/>

