    <path d="M17.2 16.5 C19.2 16.0 21.4 17.0 22.3 18.8 L27.2 23.7 C28.1 24.6 28.1 26.1 27.2 27.0 C26.3 27.9 24.8 27.9 23.9 27.0 L19.0 22.1 C17.2 21.2 16.2 19.0 16.7 17.0 Z" fill="#123E21" fill-opacity="0.85"/>
