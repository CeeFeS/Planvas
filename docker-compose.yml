services:
  # Reverse Proxy - single entry point
  nginx:
    image: nginx:alpine
    container_name: planvas-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 instead of localhost: nginx listens on IPv4 only (listen 80).
      # localhost would resolve to IPv6 [::1] inside the container and the check would fail.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    container_name: planvas-pocketbase
    restart: unless-stopped
    # No external port - only accessible through nginx
    expose:
      - "8080"
    volumes:
      # Persist PocketBase data
      - pocketbase_data:/pb/pb_data
    environment:
      - TZ=Europe/Berlin
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # Host network during build: Docker bridge DNS often hits ETIMEDOUT /
      # EHOSTUNREACH against registry.npmjs.org (IPv6), leaving npm with
      # "Exit handler never called!" and an empty node_modules.
      network: host
      args:
        # URL as seen from the browser - goes through nginx on same origin
        - NEXT_PUBLIC_POCKETBASE_URL=${NEXT_PUBLIC_POCKETBASE_URL:-}
    container_name: planvas-frontend
    restart: unless-stopped
    # No external port - only accessible through nginx
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_POCKETBASE_URL=${NEXT_PUBLIC_POCKETBASE_URL:-}
      # Internal URL for server-side requests (SSR)
      - POCKETBASE_INTERNAL_URL=http://pocketbase:8080
      - TZ=Europe/Berlin
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pocketbase_data:
    # Fixed name from the TinyPlanvas days: keeps existing installations on
    # their data no matter what the checkout directory is called.
    name: tinyplanvas_pocketbase_data
    driver: local
